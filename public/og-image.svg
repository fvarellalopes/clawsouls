<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#09090B"/>
  <!-- Gradient overlay -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="rgba(250,204,21,0.08)"/>
      <stop offset="100%" stop-color="rgba(250,204,21,0)"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FACC15"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#FACC15"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <!-- Gold accent lines -->
  <rect x="0" y="0" width="4" height="630" fill="#FACC15" opacity="0.3"/>
  <rect x="1196" y="0" width="4" height="630" fill="#FACC15" opacity="0.3"/>
  <rect x="0" y="0" width="1200" height="2" fill="#FACC15" opacity="0.2"/>
  <rect x="0" y="628" width="1200" height="2" fill="#FACC15" opacity="0.2"/>
  <!-- Corner brackets -->
  <rect x="60" y="60" width="40" height="2" fill="#FACC15"/>
  <rect x="60" y="60" width="2" height="40" fill="#FACC15"/>
  <rect x="1140" y="60" width="-40" height="2" fill="#FACC15"/>
  <rect x="1140" y="60" width="2" height="40" fill="#FACC15"/>
  <rect x="60" y="570" width="40" height="2" fill="#FACC15"/>
  <rect x="60" y="570" width="2" height="-40" fill="#FACC15"/>
  <rect x="1140" y="570" width="-40" height="2" fill="#FACC15"/>
  <rect x="1140" y="570" width="2" height="-40" fill="#FACC15"/>
  <!-- Badge -->
  <rect x="540" y="160" width="120" height="28" rx="14" fill="none" stroke="#FACC15" stroke-opacity="0.5"/>
  <text x="600" y="180" text-anchor="middle" fill="#FACC15" font-family="monospace" font-size="11" letter-spacing="3" opacity="0.8">SYSTEM ONLINE</text>
  <!-- Title -->
  <text x="600" y="310" text-anchor="middle" fill="url(#title)" font-family="sans-serif" font-size="72" font-weight="bold" letter-spacing="-1">ClawSouls</text>
  <text x="600" y="370" text-anchor="middle" fill="#A1A1AA" font-family="sans-serif" font-size="24" opacity="0.7">Visual SOUL.md Editor for AI Personalities</text>
  <!-- Features -->
  <g opacity="0.5">
    <circle cx="320" cy="440" r="4" fill="#FACC15"/>
    <text x="335" y="445" fill="#A1A1AA" font-family="sans-serif" font-size="16">522 Presets</text>
    <circle cx="520" cy="440" r="4" fill="#FACC15"/>
    <text x="535" y="445" fill="#A1A1AA" font-family="sans-serif" font-size="16">7 Languages</text>
    <circle cx="720" cy="440" r="4" fill="#FACC15"/>
    <text x="735" y="445" fill="#A1A1AA" font-family="sans-serif" font-size="16">325 Avatars</text>
  </g>
